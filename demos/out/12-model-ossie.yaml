version: 0.2.0.dev0
name: auto_ontology_model
datasets:
- name: customer
  source: pagila.public.customer
  description: A person who rents films from a store.
  primary_key:
  - customer_id
  fields:
  - name: customer_email
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: email
    datatype: String
    description: Contact address.
  - name: customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_id
    datatype: Integer
    description: Primary key of customer.
  - name: customer_lifetime_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_id
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"ba0fea61-856d-4dbc-8b0f-17469875f8d5","ossie_expression":"customer_id","sql":"SELECT
        customer_id, sum(amount) FROM payment GROUP BY customer_id","sql_column_is":["9318c1aa-0199-4ea0-b1fa-8e8cf073d639","e4ef13a0-0550-4a3b-9512-cfb62bf38176"],"sql_source":"table","term_id":"1494ca89-18dd-4978-8491-f448b66a1e89"}'
    description: Total paid by each customer.
- name: film
  source: pagila.public.film
  description: A motion picture available for rental.
  primary_key:
  - film_id
  fields:
  - name: film_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: film_id
    datatype: Integer
    description: Primary key of film.
  - name: film_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rating
    datatype: Opaque
    description: MPAA rating; an enum.
  - name: film_title
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: title
    datatype: String
    description: The film's title.
  - name: film_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(film_id)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"99b9e471-4019-448d-b461-1f42fcac89d5","ossie_expression":"COUNT(film_id)","sql":"SELECT
        count(film_id) FROM film","sql_column_is":["0d62f166-25c0-4960-aae7-8c32118e7f77"],"sql_source":"sql","term_id":"fc01c40a-11db-4f5d-a8cf-3ebcfe8e137e"}'
    description: Number of films in the catalog.
  - name: films_per_category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c.name
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"dcbf41eb-a51d-4635-82d4-a358c539716e","ossie_expression":"c.name","sql":"SELECT
        c.name, count(fc.film_id) FROM film_category fc JOIN category c ON c.category_id
        = fc.category_id GROUP BY c.name","sql_column_is":["db9c5dc3-77d0-43db-9b42-a590ebd34881","99150c74-ff2c-4e17-bf4a-8ba7fabc5234","b5e654e8-461f-4d40-aef0-9f59f512f174","00b84aff-f672-46c4-8a67-762807ee15a4"],"sql_source":"bridge_table","term_id":"fc01c40a-11db-4f5d-a8cf-3ebcfe8e137e"}'
    description: Film count grouped by category, via the bridge table.
- name: payment
  source: pagila.public.payment
  description: Money received for a rental. Owning table is partitioned.
  primary_key:
  - payment_date
  - payment_id
  fields:
  - name: payment_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: Decimal
    description: Amount paid.
  - name: total_revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(amount)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"96439e95-b09c-4b2c-982a-e7552f0e6396","ossie_expression":"SUM(amount)","sql":"SELECT
        sum(amount) FROM payment","sql_column_is":["e4ef13a0-0550-4a3b-9512-cfb62bf38176"],"sql_source":"manual","term_id":"f97d128a-57fd-4db3-a40f-7a7ca244eef3"}'
    description: Sum of all payment amounts.
  - name: payment_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: payment_date
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: payment_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: payment_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: rental
  source: pagila.public.rental
  description: A single film rental transaction.
  primary_key:
  - rental_id
  fields:
  - name: rental_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rental_date
    datatype: DateTimeTz
    description: When the rental started.
  - name: rental_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rental_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
